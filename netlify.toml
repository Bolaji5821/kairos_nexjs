[build]
  command = "cd frontend && npm run build"
  publish = "frontend/.next"

[dev]
  command = "cd frontend && npm run dev"

[[plugins]]
  package = "@netlify/next"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["绕过"] }
